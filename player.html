<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>IPTV M3U8 Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Plyr -->
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>

<style>
body {
  margin: 0;
  background: #020617;
  color: #fff;
  font-family: Arial, sans-serif;
}

.header {
  padding: 12px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  border-bottom: 1px solid #1e293b;
}

.container {
  padding: 12px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 15px;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

video {
  width: 100%;
  max-height: 70vh;
  margin-top: 10px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="header">📺 IPTV M3U8 Player</div>

<div class="container">
  <input id="m3u8" type="text" placeholder="Dán link M3U8 vào đây...">
  <button onclick="play()">▶ Xem</button>

  <video id="video" controls></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
const video = document.getElementById("video");
const player = new Plyr(video);
let hls;

function play() {
  const url = document.getElementById("m3u8").value.trim();
  if (!url) {
    alert("Bạn chưa nhập link M3U8");
    return;
  }

  if (hls) hls.destroy();

  if (Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
    video.play();
  } else {
    alert("Thiết bị không hỗ trợ HLS");
  }
}
</script>

</body>
</html>
