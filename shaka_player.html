<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Shaka + Video.js + ClearKey</title>

<!-- Shaka Player -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

<!-- Video.js -->
<link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">
<script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>

<style>
body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:Arial;
}
.container{
    max-width:900px;
    margin:auto;
    padding:10px;
}
input, textarea{
    width:100%;
    padding:8px;
    margin:6px 0;
    border-radius:6px;
    border:none;
}
button{
    width:100%;
    padding:10px;
    background:#22c55e;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}
textarea{resize:none}
</style>
</head>

<body>
<div class="container">

<video
  id="video"
  class="video-js vjs-default-skin"
  controls
  playsinline
  width="100%"
  height="500">
</video>

<input id="mpd" placeholder="Link .mpd (DASH DRM)">

<textarea id="keys" rows="3"
placeholder="ClearKey (kid:key)
Ví dụ:
1ae8ccd0e0b8e0c8d4c1b7d1e8b9a123:aabbccddeeff00112233445566778899">
</textarea>

<button onclick="play()">Play</button>

</div>

<script>
let shakaPlayer;
let vjsPlayer;

async function init(){
    if(!shaka.Player.isBrowserSupported()){
        alert("Browser không hỗ trợ DRM");
        return;
    }

    const video = document.getElementById('video');

    // Video.js init
    vjsPlayer = videojs(video, {
        autoplay: false,
        controls: true,
        fluid: true,
        preload: 'auto'
    });

    // Shaka init
    shakaPlayer = new shaka.Player(video);

    shakaPlayer.addEventListener('error', e => {
        console.error(e);
        alert("Lỗi DRM / Stream");
    });
}

function parseKeys(text){
    const lines = text.split('\n');
    const keys = {};
    for(const line of lines){
        if(!line.trim()) continue;
        const [kid, key] = line.split(':');
        if(!kid || !key) throw "Sai key";
        keys[kid.trim()] = key.trim();
    }
    return keys;
}

async function play(){
    const mpd = document.getElementById('mpd').value.trim();
    const keysText = document.getElementById('keys').value.trim();

    if(!mpd || !keysText)
        return alert("Thiếu MPD hoặc KEY");

    let keys;
    try{
        keys = parseKeys(keysText);
    }catch(e){
        return alert("KEY phải ở dạng kid:key");
    }

    shakaPlayer.configure({
        drm: {
            clearKeys: keys
        }
    });

    try{
        await shakaPlayer.load(mpd);
        vjsPlayer.play();
    }catch(e){
        console.error(e);
        alert("Không load được DRM stream");
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
